{% extends "layout.html" %}
{% block content %}

<h2>Modifier le fournisseur #{{ fournisseur.id }}</h2>

<div class="card card-body mt-3">
  <form action="{{ url_for('fournisseurs_modifier', fid=fournisseur.id) }}" method="post" class="row g-3">
    <div class="col-md-4"><label class="form-label">Nom*</label><input class="form-control" name="nom" value="{{ fournisseur.nom }}" required></div>
    <div class="col-md-4"><label class="form-label">Contact</label><input class="form-control" name="contact" value="{{ fournisseur.contact or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Téléphone</label><input class="form-control" name="telephone" value="{{ fournisseur.telephone or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ fournisseur.email or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Adresse</label><input class="form-control" name="adresse" value="{{ fournisseur.adresse or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Ville</label><input class="form-control" name="ville" value="{{ fournisseur.ville or '' }}"></div>
    <div class="col-12">
      <button class="btn btn-primary" type="submit">Enregistrer les modifications</button>
      <a href="{{ url_for('fournisseurs_list') }}" class="btn btn-light">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
